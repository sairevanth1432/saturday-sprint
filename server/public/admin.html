<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Saturday Sprint · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--panel:#151515;--panel2:#1B1B1B;--well:#050505;--line:#2A2A2A;--line2:#3A3A3A;--muted:#8A8A8A;--soft:#BDBDBD;--text:#FFFFFF;--accent:#FFE45C;--bad:#FF7A7A;--good:#9BE58B;--info:#8EC5FF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"JetBrains Mono",system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
a{color:var(--accent)}
[hidden]{display:none !important}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:"Silkscreen",monospace;font-weight:700;font-size:24px;line-height:.95;padding:0 6px}
.brand span{color:var(--accent)}
.brand small{display:block;font-family:"VT323",monospace;font-weight:400;font-size:18px;color:var(--muted);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--text);font-weight:700;text-align:left}
.nav button:hover{background:#222}
.nav button[aria-current="page"]{background:var(--accent);color:#050505}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.badge{min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#050505;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.me{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--well)}
.me b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me span{color:var(--muted);font-size:12px}
main{padding:28px 32px 60px;min-width:0}
h1{margin:0;font-size:26px;font-weight:800}
h2{margin:0 0 12px;font-size:17px;font-weight:800}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head p{margin:6px 0 0;color:var(--soft)}
.kicker{font-family:"VT323",monospace;font-size:18px;color:var(--accent)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border-radius:16px;padding:18px 20px;border:1px solid var(--line)}
.stat .k{color:var(--soft);font-size:13px;font-weight:700}
.stat .v{font-family:"VT323",monospace;font-size:44px;line-height:1.05}
.stat .s{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex-grow:1}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],input[type=search],select,textarea{
  min-height:40px;padding:0 12px;border:2px solid var(--line2);border-radius:10px;background:var(--well);color:var(--text);outline:none}
textarea{padding:10px 12px;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=search]{min-width:280px}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:2px solid var(--line2);background:transparent;color:var(--text);font-weight:800;white-space:nowrap}
.btn:hover{border-color:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#050505}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#1E1E1E}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:"VT323",monospace;font-size:18px}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:calc(100vh - 230px)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid var(--line2);color:var(--soft);white-space:nowrap}
.pill.ok{border-color:var(--good);color:var(--good)}
.pill.warn{border-color:var(--accent);color:var(--accent)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.pill.info{border-color:var(--info);color:var(--info)}
.muted{color:var(--muted)}
.soft{color:var(--soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:800;color:var(--soft)}
.note{padding:12px 14px;border-radius:12px;border:1px dashed var(--line2);color:var(--soft);line-height:1.55}
.note.warn{border-color:var(--accent);color:var(--accent)}
.note.bad{border-color:var(--bad);color:var(--bad)}
pre.code{margin:0;padding:12px 14px;background:var(--well);border-radius:10px;white-space:pre-wrap;font-family:"VT323",monospace;font-size:18px;line-height:1.35;max-height:360px;overflow:auto}
.drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(860px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:24px 26px 60px;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;right:20px;bottom:20px;z-index:80;max-width:520px;padding:12px 16px;border-radius:12px;background:var(--panel2);border:2px solid var(--good);font-weight:700;box-shadow:0 18px 40px -12px #000}
.toast.err{border-color:var(--bad)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.auth .card{display:flex;flex-direction:column;gap:14px;padding:24px}
.auth input{width:100%}
.qr{background:#fff;border-radius:12px;padding:10px;width:200px;height:200px}
.qr svg{width:100%;height:100%;display:block}
.secret{font-family:"VT323",monospace;font-size:22px;letter-spacing:2px;word-break:break-all;color:var(--accent)}
.q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.opt.correct{border-color:var(--good)}
.opt.picked{background:rgba(255,228,92,.08)}
.opt.wrong{border-color:var(--bad)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:20px 16px}input[type=search]{min-width:0;width:100%}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';
  // ------------------------------------------------------------------ helpers
  var root = document.getElementById('root');
  var ME = null, VIEW = (location.hash || '#overview').slice(1), CACHE = {};

  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'html') el.innerHTML = v; // only used for server-generated SVG
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) return kid.forEach(function (k) { add(el, k); });
    el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  function api(method, url, body) {
    var init = { method: method, credentials: 'same-origin', headers: {} };
    if (body !== undefined) { init.headers['content-type'] = 'application/json'; init.body = JSON.stringify(body); }
    return fetch(url, init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 401 && url.indexOf('/api/admin/login') !== 0) { ME = null; loginScreen(); throw Object.assign(new Error('Session expired. Log in again.'), { silent: true }); }
        if (!r.ok) throw Object.assign(new Error(d.message || 'Request failed (' + r.status + ')'), d);
        return d;
      });
    }, function () { throw new Error('No connection to the server.'); });
  }
  var toastT;
  function toast(msg, err) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = h('div', { class: 'toast' + (err ? ' err' : ''), role: err ? 'alert' : 'status' }, msg);
    document.body.appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(function () { t.remove(); }, err ? 7000 : 3500);
  }
  function fail(e) { if (!e.silent) toast(e.message, true); }
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var dt = function (ms) { if (!ms) return '–'; var d = new Date(ms); return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short' }) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  var mmss = function (ms) { if (ms == null) return '–'; var s = Math.round(ms / 1000); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
  var sc = function (x) { return x == null ? '–' : String(Math.round(Number(x) * 100) / 100); };
  var isSuper = function () { return ME && ME.role === 'super_admin'; };
  function pill(text, kind) { return h('span', { class: 'pill ' + (kind || '') }, text); }
  function debounce(fn, ms) { var t; return function () { var a = arguments, s = this; clearTimeout(t); t = setTimeout(function () { fn.apply(s, a); }, ms); }; }
  function download(url) { var a = h('a', { href: url, download: '' }); document.body.appendChild(a); a.click(); a.remove(); }
  function localInput(iso) { var d = new Date(iso); if (isNaN(d)) return ''; return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  // ------------------------------------------------------------------ auth screens
  function authShell(title, sub, body) {
    root.replaceChildren(h('div', { class: 'center' }, h('div', { class: 'auth' },
      h('div', null, h('div', { class: 'kicker' }, '~/admin · secure login'), h('div', { class: 'brand', style: 'padding:0;font-size:34px;margin-top:6px' }, 'Saturday ', h('span', null, 'Sprint'))),
      h('div', { class: 'card' }, h('h1', { style: 'font-size:20px' }, title), sub ? h('p', { class: 'soft', style: 'margin:0;line-height:1.5' }, sub) : null, body),
      h('p', { class: 'muted', style: 'font-size:12px;line-height:1.5;margin:0' }, 'Admin access only. Students log in at ', h('a', { href: '/login' }, '/login'), '.'))));
  }
  function errBox() { return h('div', { class: 'note bad', hidden: true }); }
  function showErr(box, e) { box.textContent = e.message; box.hidden = false; }

  function loginScreen() {
    var email = h('input', { type: 'email', autocomplete: 'username', placeholder: 'you@nxtwave.co.in', required: true });
    var pw = h('input', { type: 'password', autocomplete: 'current-password', placeholder: 'Password', required: true });
    var err = errBox(), btn = h('button', { class: 'btn pri', type: 'submit' }, 'Continue');
    var f = h('form', { style: 'display:flex;flex-direction:column;gap:12px', onsubmit: function (e) {
      e.preventDefault(); err.hidden = true; btn.disabled = true;
      api('POST', '/api/admin/login', { email: email.value, password: pw.value }).then(function (r) {
        if (r.next === 'totp') totpScreen(); else if (r.next === 'setup') setupScreen(); else boot();
      }, function (e) { showErr(err, e); btn.disabled = false; });
    } }, h('div', { class: 'field' }, h('label', null, 'Email'), email), h('div', { class: 'field' }, h('label', null, 'Password'), pw), btn, err);
    authShell('Admin login', null, f);
    email.focus();
  }
  function codeInput() { return h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 6, placeholder: '123456', class: 'mono', style: 'font-size:28px;letter-spacing:8px;text-align:center' }); }
  function totpScreen() {
    var code = codeInput(), err = errBox(), btn = h('button', { class: 'btn pri', type: 'submit' }, 'Verify');
    var f = h('form', { style: 'display:flex;flex-direction:column;gap:12px', onsubmit: function (e) {
      e.preventDefault(); err.hidden = true; btn.disabled = true;
      api('POST', '/api/admin/login/totp', { code: code.value }).then(boot, function (e) { showErr(err, e); btn.disabled = false; code.select(); });
    } }, code, btn, err, h('button', { type: 'button', class: 'btn', onclick: loginScreen }, 'Back'));
    authShell('Authenticator code', 'Enter the 6-digit code from your authenticator app.', f);
    code.focus();
  }
  function setupScreen() {
    authShell('Set up two-step verification', 'Admins must use an authenticator app (Google Authenticator, Microsoft Authenticator, Authy…).', h('div', { class: 'muted' }, 'Loading…'));
    api('GET', '/api/admin/totp/setup').then(function (s) {
      var code = codeInput(), err = errBox(), btn = h('button', { class: 'btn pri', type: 'submit' }, 'Turn on and continue');
      var f = h('form', { style: 'display:flex;flex-direction:column;gap:12px', onsubmit: function (e) {
        e.preventDefault(); err.hidden = true; btn.disabled = true;
        api('POST', '/api/admin/totp/enable', { code: code.value }).then(boot, function (e) { showErr(err, e); btn.disabled = false; code.select(); });
      } },
        h('ol', { style: 'margin:0;padding-left:20px;line-height:1.7' },
          h('li', null, 'Open your authenticator app and scan this code.'),
          h('li', null, 'Or enter the setup key manually.'),
          h('li', null, 'Type the 6-digit code it shows.')),
        h('div', { class: 'qr', html: s.qrSvg }),
        h('div', null, h('div', { class: 'muted', style: 'font-size:12px;font-weight:800' }, 'Setup key'), h('div', { class: 'secret' }, s.secret.replace(/(.{4})/g, '$1 ').trim())),
        code, btn, err);
      authShell('Set up two-step verification', 'Admins must use an authenticator app (Google Authenticator, Microsoft Authenticator, Authy…).', f);
      code.focus();
    }, function (e) { if (!e.silent) { toast(e.message, true); loginScreen(); } });
  }
  function passwordForm(forced) {
    var cur = h('input', { type: 'password', autocomplete: 'current-password' });
    var nx = h('input', { type: 'password', autocomplete: 'new-password' });
    var nx2 = h('input', { type: 'password', autocomplete: 'new-password' });
    var err = errBox(), btn = h('button', { class: 'btn pri', type: 'submit' }, 'Change password');
    return h('form', { style: 'display:flex;flex-direction:column;gap:12px;max-width:420px', onsubmit: function (e) {
      e.preventDefault(); err.hidden = true;
      if (nx.value !== nx2.value) return showErr(err, new Error('The new passwords do not match.'));
      btn.disabled = true;
      api('POST', '/api/admin/password', { current: cur.value, next: nx.value }).then(function () {
        toast('Password changed.'); if (forced) boot(); else { cur.value = nx.value = nx2.value = ''; btn.disabled = false; }
      }, function (e) { showErr(err, e); btn.disabled = false; });
    } },
      h('div', { class: 'field' }, h('label', null, forced ? 'Temporary password' : 'Current password'), cur),
      h('div', { class: 'field' }, h('label', null, 'New password (12+ characters, letters and a number)'), nx),
      h('div', { class: 'field' }, h('label', null, 'Repeat new password'), nx2), btn, err);
  }

  function boot() {
    api('GET', '/api/admin/me').then(function (me) {
      ME = me;
      if (me.mustChangePw) return authShell('Choose your password', 'You signed in with a temporary password. Set your own to continue.', passwordForm(true));
      go(VIEW);
    }, function (e) { if (!e.silent) loginScreen(); });
  }

  // ------------------------------------------------------------------ layout
  var NAV = [
    ['overview', 'Overview'], ['approvals', 'Approvals'], ['students', 'Students'], ['results', 'Results'], ['leaderboard', 'Leaderboard'],
    ['media', 'Learning bytes'], ['master', 'Master data'], ['feedback', 'Feedback'], '-', ['settings', 'Sprint settings'], ['admins', 'Admins', true], ['audit', 'Audit log'], ['account', 'My account']
  ];
  function layout(content) {
    var nav = h('div', { class: 'nav' }, NAV.map(function (n) {
      if (n === '-') return h('div', { class: 'sep' });
      if (n[2] && !isSuper()) return null;
      return h('button', { 'aria-current': VIEW === n[0] ? 'page' : null, onclick: function () { go(n[0]); } }, n[1],
        n[0] === 'results' && CACHE.pending ? h('span', { class: 'badge', title: 'Written answers waiting for marks' }, CACHE.pending) : null,
        n[0] === 'approvals' && CACHE.approvals ? h('span', { class: 'badge', title: 'Registrations waiting for approval' }, CACHE.approvals) : null);
    }));
    return h('div', { class: 'shell' },
      h('aside', { class: 'side' },
        h('div', { class: 'brand' }, 'Saturday', h('br'), h('span', null, 'Sprint'), h('small', null, 'admin console')),
        nav,
        h('a', { class: 'btn', href: '/', target: '_blank', rel: 'noopener', style: 'display:flex;align-items:center;justify-content:center;text-decoration:none' }, 'Open student portal ↗'),
        h('div', { class: 'me' }, h('b', { title: ME.email }, ME.name || ME.email), h('span', null, (ME.role === 'super_admin' ? 'Super admin' : 'Admin') + ' · ' + ME.email),
          h('button', { class: 'btn sm', onclick: function () { api('POST', '/api/admin/logout').then(loginScreen, loginScreen); } }, 'Log out'))),
      h('main', null, content));
  }
  function header(kicker, title, sub, actions) {
    return h('div', { class: 'head' }, h('div', null, h('div', { class: 'kicker' }, kicker), h('h1', null, title), sub ? h('p', null, sub) : null), actions ? h('div', { class: 'row' }, actions) : null);
  }
  function go(view) {
    VIEW = VIEWS[view] ? view : 'overview';
    if (VIEW === 'admins' && !isSuper()) VIEW = 'overview';
    try { history.replaceState(null, '', '#' + VIEW); } catch (e) {}
    var holder = h('div', { class: 'muted' }, 'Loading…');
    root.replaceChildren(layout(holder));
    Promise.resolve().then(function () { return VIEWS[VIEW](); }).then(function (node) {
      if (node) root.replaceChildren(layout(node));
    }, function (e) { fail(e); holder.textContent = e.message; });
  }
  function refresh() { go(VIEW); }

  function drawer(content) {
    var back = h('div', { class: 'drawer-back', onclick: function (e) { if (e.target === back) close(); } });
    var close = function () { back.remove(); document.removeEventListener('keydown', esc); };
    var esc = function (e) { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', esc);
    var panel = h('div', { class: 'drawer', role: 'dialog', 'aria-modal': 'true' });
    back.appendChild(panel); document.body.appendChild(back);
    var set = function (node) { panel.replaceChildren(h('div', { class: 'row', style: 'justify-content:flex-end' }, h('button', { class: 'btn sm', onclick: close }, 'Close ✕')), node); };
    set(content || h('div', { class: 'muted' }, 'Loading…'));
    return { set: set, close: close };
  }

  // ------------------------------------------------------------------ views
  var VIEWS = {};

  VIEWS.overview = function () {
    return api('GET', '/api/admin/overview').then(function (o) {
      CACHE.pending = o.attempts.pending_review || 0;
      CACHE.approvals = o.pendingApprovals || 0;
      var c = o.counts, a = o.attempts, s = o.sprint, now = o.serverNow;
      var phase = now < s.openMs ? ['Opens ' + dt(s.openMs), 'info'] : now < s.closeMs ? ['Live now', 'warn'] : ['Closed', ''];
      var stat = function (k, v, sub) { return h('div', { class: 'card stat' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v), sub ? h('div', { class: 's' }, sub) : null); };
      var warn = [];
      if (!o.studentsFileExists && !c.master_active) warn.push(h('div', { class: 'note warn' }, 'No student master data yet. Save the student Excel sheet as ', h('b', null, o.studentsFile), ' (it loads automatically) or upload it in ', h('a', { href: '#master', onclick: function (e) { e.preventDefault(); go('master'); } }, 'Master data'), '. Until then nobody can register.'));
      if (o.testOtp && o.infra.vercel) warn.push(h('div', { class: 'note bad' }, 'TEST MODE: login codes are shown on screen (PRELAUNCH_TEST_MODE / ALLOW_TEST_OTP). Before students use the site, remove that setting in Vercel and set a real SMS provider (OTP_PROVIDER).'));
      if (o.infra.vercel && !o.infra.redis) warn.push(h('div', { class: 'note bad' }, 'Redis (Upstash) is not connected. Rate limits, caches and autosave stay inside each instance. Connect Upstash before going live.'));
